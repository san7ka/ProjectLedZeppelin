# Test Configuration Properties

# Database Configuration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=create-drop
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.use_sql_comments=false

# Connection Pool Settings
hibernate.hikari.maximumPoolSize=5
hibernate.hikari.minimumIdle=1
hibernate.hikari.connectionTimeout=30000
hibernate.hikari.idleTimeout=600000
hibernate.hikari.maxLifetime=1800000

# Batch Processing
hibernate.jdbc.batch_size=20
hibernate.jdbc.batch_versioned_data=true
hibernate.order_inserts=true
hibernate.order_updates=true

# Caching (disabled for tests)
hibernate.cache.use_second_level_cache=false
hibernate.cache.use_query_cache=false

# Lazy Loading
hibernate.enable_lazy_load_no_trans=true
hibernate.default_batch_fetch_size=16
hibernate.jdbc.fetch_size=50

# Statistics
hibernate.generate_statistics=true
hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=100

# Liquibase (disabled for tests)
liquibase.enabled=false

# Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.orm.hibernate5=WARN
logging.level.com.javarush.lepeshinskij=DEBUG
